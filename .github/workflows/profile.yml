name: profile card

on:
  schedule:
    - cron: '17 3 * * *'   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [gen.py, art.txt, art_light.txt, stats.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python card/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python card/gen.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/stats.json card/dark_mode.svg card/light_mode.svg
          git diff --cached --quiet || (git commit -m "Update profile card stats" && git push)
