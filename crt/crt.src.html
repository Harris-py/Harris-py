<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'VT323'; src: url(VT323.woff2) format('woff2'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="800" height="541"></canvas>
<script>
// A green-phosphor CRT: a dithered pixel portrait draws in, the info types out, the colour test row lights up.
// Every frame is a pure function of t, so render.mjs can step through it.
const P = __PORTRAIT__;
const TEXT = __TEXT__;   // info.txt: 'Key: value' lines, blank lines, and '---' for a new screen
const PROMPT = 'harris@mbp$ ';
const W = 800, H = 541;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const PAL = ['#2F6B34', '#5DAE5E', '#9BD88F', '#E8F6DC'];    // dark, mid (background), light, white
const PANEL = { x: 28, y: 18, w: 428, h: 480, px: 4, band: 16 };
const TX = 484, TY = 34, LH = 22;
const SW = [['#3E5F3A', '#D08A3E', '#4FCF6A', '#E3D45A', '#3FD1A0', '#C98A8A', '#43D68B', '#A9E7A2'],
            ['#8FD48A', '#B9E6A9', '#C8EBB0', '#E2F0A8', '#BFE9C8', '#D7EDCB', '#C9EFC9', '#E4F7DD']];
let noiseSeed = 1;
const rnd = () => (noiseSeed = noiseSeed * 16807 % 2147483647) / 2147483647;

// Wrap info.txt to the column, split it into screens, and give every line its typing time.
const RIGHT = 784, BOTTOM = 470, CPS = 60, HOLD = 2.2;
let PAGES = null;
function layout() {
  cx.font = '24px VT323';
  const maxW = RIGHT - TX, rows = [];
  for (const raw of TEXT.replace(/\r/g, '').split('\n')) {
    if (raw.trim() === '---') { rows.push({ br: true }); continue; }
    if (!raw.trim()) { rows.push({ s: '' }); continue; }
    const m = /^([^:]{1,24}:\s)(.*)$/.exec(raw);
    const lead = m ? '' : /^\s*/.exec(raw)[0];                 // keep a line's own indentation
    const indent = m ? ' '.repeat(m[1].length) : lead + '  ';  // wrapped lines hang under the value
    let line = m ? m[1] : lead, first = true;
    for (const word of (m ? m[2] : raw.trim()).split(/\s+/)) {
      const tryLine = line + (line.trim() && !line.endsWith(' ') ? ' ' : '') + word;
      if (cx.measureText(tryLine).width > maxW && line.trim() && !(first && m && line === m[1])) { rows.push({ s: line }); line = indent + word; first = false; }
      else line = tryLine;
    }
    rows.push({ s: line });
  }
  // fill screens; the first one keeps room for the colour swatches
  const pages = [[]];
  const cap = (i) => Math.floor((BOTTOM - TY) / LH) - (i === 0 ? 3 : 0);
  for (const r of rows) {
    const pg = pages[pages.length - 1];
    if (r.br) { if (pg.length) pages.push([]); continue; }
    if (pg.length >= cap(pages.length - 1)) pages.push([]);
    const cur = pages[pages.length - 1];
    if (!(r.s === '' && cur.length === 0)) cur.push(r.s);
  }
  if (!pages[pages.length - 1].length) pages.pop();
  let t = 2.5;
  PAGES = pages.map((lines, i) => {
    const L = lines.map(s => { const o = { s, t }; t += s.length / CPS + .06; return o; });
    const typedEnd = t;
    if (i === 0) t += .9;                                       // swatches light up
    const page = { lines: L, start: L.length ? L[0].t : t, typedEnd, swatchAt: i === 0 ? typedEnd + .3 : null };
    t += HOLD;
    if (i < pages.length - 1) { page.clearAt = t; t += 'clear'.length / 9 + .35; page.wipeAt = t - .25; }
    page.end = t;
    return page;
  });
  window.__duration = Math.ceil((t + .6) * 10) / 10;
  return PAGES;
}
const pageAt = (t) => PAGES.find(p => t < p.end) || PAGES[PAGES.length - 1];

function portrait(t) {
  const { x, y, w, h, px, band } = PANEL;
  const bands = Math.ceil(h / band);
  for (let b = 0; b < bands; b++) {
    const start = .25 + b * (2.1 / bands);
    const k = clamp((t - start) / .22);                     // this band sweeps left to right
    if (k <= 0) continue;
    const cols = Math.ceil(P.w * k);
    for (let r = Math.floor(b * band / px); r < Math.min(P.h, (b + 1) * band / px); r++) {
      for (let c = 0; c < cols; c++) {
        const v = P.px[r * P.w + c];
        const level = v < 0 ? 1 : v * 3;                     // background: flat mid green; subject: dark, light and white
        const base = Math.floor(level), frac = level - base;
        const idx = Math.min(3, base + (frac > BAYER[(r % 4) * 4 + (c % 4)] ? 1 : 0));
        cx.fillStyle = PAL[idx];
        cx.fillRect(x + c * px, y + r * px, px, px);
      }
    }
    // the dark rule between bands, as on the original
    cx.fillStyle = 'rgba(20,50,22,.55)';
    cx.fillRect(x, y + (b + 1) * band - 2, w * k, 2);
  }
  cx.strokeStyle = 'rgba(160,230,150,.25)'; cx.lineWidth = 1; cx.strokeRect(x - .5, y - .5, w + 1, h + 1);
}

function text(t) {
  const pg = pageAt(t);
  cx.font = '24px VT323'; cx.textBaseline = 'alphabetic';
  cx.shadowColor = 'rgba(140,255,140,.75)'; cx.shadowBlur = 8;
  const wipe = pg.wipeAt ? clamp((t - pg.wipeAt) / .25) : 0;   // lines vanish bottom-up as `clear` runs
  let cursor = null;
  pg.lines.forEach((L, i) => {
    if (wipe > 0 && i >= pg.lines.length * (1 - wipe)) return;
    const n = Math.floor(clamp((t - L.t) * CPS, 0, L.s.length));
    if (n <= 0) return;
    const shown = L.s.slice(0, n), yy = TY + i * LH;
    cx.fillStyle = '#B6F7A4';
    cx.fillText(shown, TX, yy);
    if (n < L.s.length) cursor = [TX + cx.measureText(shown).width + 2, yy];
  });
  if (cursor) { cx.fillStyle = '#B6F7A4'; cx.fillRect(cursor[0], cursor[1] - 16, 9, 18); }
  cx.shadowBlur = 0;
}

function swatches(t) {
  const pg = pageAt(t);
  if (pg !== PAGES[0]) return;
  const k = clamp((t - pg.swatchAt) / .6) * (pg.wipeAt ? 1 - clamp((t - pg.wipeAt) / .25) : 1);
  if (k <= 0) return;
  const s = 28, x0 = TX + 2, y0 = TY + pg.lines.length * LH + 22;
  SW.forEach((row, r) => row.forEach((col, c) => {
    const on = clamp(k * 16 - (r * 8 + c) * .7);
    if (on <= 0) return;
    cx.globalAlpha = on; cx.fillStyle = col;
    cx.fillRect(x0 + c * s + (r === 0 ? s : 0), y0 + r * (s - 6), s, s - 6);
  }));
  cx.globalAlpha = 1;
}

function prompt(t) {
  const pg = pageAt(t);
  cx.font = '24px VT323'; cx.shadowColor = 'rgba(140,255,140,.75)'; cx.shadowBlur = 8; cx.fillStyle = '#B6F7A4';
  const typed = pg.clearAt ? 'clear'.slice(0, Math.floor(clamp((t - pg.clearAt) * 9, 0, 5))) : '';
  const line = PROMPT + typed;
  cx.fillText(line, 28, 522);
  const typing = t >= pg.start && t < pg.typedEnd;         // the prompt cursor rests while a screen is typing
  if (typing || Math.floor(t * 2) % 2 === 0) cx.fillRect(28 + cx.measureText(line).width, 506, 9, 19);
  cx.shadowBlur = 0;
}

function crt(t) {
  // scanlines
  cx.fillStyle = 'rgba(0,0,0,.18)';
  for (let y = 0; y < H; y += 3) cx.fillRect(0, y, W, 1);
  // a soft bright band rolling down the screen
  const by = ((t * 90) % (H + 160)) - 80;
  const g = cx.createLinearGradient(0, by - 60, 0, by + 60);
  g.addColorStop(0, 'rgba(180,255,170,0)'); g.addColorStop(.5, 'rgba(180,255,170,.05)'); g.addColorStop(1, 'rgba(180,255,170,0)');
  cx.fillStyle = g; cx.fillRect(0, by - 60, W, 120);
  // noise
  noiseSeed = 1 + Math.floor(t * 3) * 97;   // grain changes a few times a second (keeps the GIF small)
  cx.fillStyle = 'rgba(200,255,200,.035)';
  for (let i = 0; i < 900; i++) cx.fillRect(rnd() * W, rnd() * H, 1.5, 1.5);
  // a steady slight dimming instead of per-frame flicker, which would make every GIF frame different
  cx.fillStyle = 'rgba(0,0,0,.03)'; cx.fillRect(0, 0, W, H);
  // vignette and the curved glass edge
  const v = cx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.65)');
  cx.fillStyle = v; cx.fillRect(0, 0, W, H);
}

window.__seek = (t) => {
  if (!PAGES) layout();
  cx.clearRect(0, 0, W, H);
  // bezel and screen
  cx.fillStyle = '#121410'; cx.fillRect(0, 0, W, H);
  cx.save();
  const r = 26; cx.beginPath(); cx.roundRect(10, 6, W - 20, H - 12, r); cx.clip();
  const bg = cx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * .6);
  bg.addColorStop(0, '#16351A'); bg.addColorStop(1, '#0A1A0C');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
  // power-on: the picture blooms in from a bright line
  const on = clamp(t / .35);
  cx.globalAlpha = on;
  portrait(t); text(t); swatches(t); prompt(t);
  cx.globalAlpha = 1;
  crt(t);
  if (t < .35) { cx.fillStyle = `rgba(200,255,200,${1 - on})`; const hh = 2 + on * H; cx.fillRect(10, H / 2 - hh / 2, W - 20, hh); }
  cx.restore();
  // glass reflection
  const gl = cx.createLinearGradient(0, 0, W, H);
  gl.addColorStop(0, 'rgba(255,255,255,.05)'); gl.addColorStop(.35, 'rgba(255,255,255,0)');
  cx.fillStyle = gl; cx.beginPath(); cx.roundRect(10, 6, W - 20, H - 12, 26); cx.fill();
};
document.fonts.load('24px VT323').then(() => { layout(); window.__seek(Number(new URLSearchParams(location.search).get('t') || 10)); });
</script>
</body>
</html>
